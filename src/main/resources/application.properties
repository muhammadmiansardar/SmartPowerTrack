spring.application.name=smart-power-track
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/powertrack;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.servlet.session.timeout=120m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.error.include-message=never
server.error.include-stacktrace=never
spring.jackson.time-zone=Africa/Johannesburg
powertrack.demo.seed=${DEMO_SEED:true}
powertrack.upload-dir=${UPLOAD_DIR:./data/uploads}
logging.level.org.springframework.jdbc=INFO
